apiVersion: apps/v1
kind: Deployment
metadata:
  name: regintel-api
  labels:
    app.kubernetes.io/name: regintel-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: regintel-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: regintel-api
    spec:
      serviceAccountName: regintel
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: regintel-api
      containers:
        - name: api
          image: regintel-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: regintel-config
          env:
            # Non-owner role so row-level security applies (scripts/provision_app_role.py).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: regintel-secrets, key: APP_DATABASE_URL}
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: regintel-secrets, key: JWT_SECRET_KEY}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: regintel-secrets, key: GEMINI_API_KEY, optional: true}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /cache}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {sizeLimit: 2Gi}
