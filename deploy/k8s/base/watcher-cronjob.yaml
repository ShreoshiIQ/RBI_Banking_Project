apiVersion: batch/v1
kind: CronJob
metadata:
  name: regintel-rbi-watcher
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid  # state.json must have a single writer
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1500
      template:
        metadata:
          labels:
            app.kubernetes.io/name: regintel-watcher
        spec:
          serviceAccountName: regintel
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watcher
              image: regintel-api:latest
              command: ["python", "-m", "regintel.watch.rbi_watcher", "--root", "/data"]
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: regintel-data
            - name: tmp
              emptyDir: {}
