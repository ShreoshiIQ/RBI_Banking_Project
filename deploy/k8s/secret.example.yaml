# Example only, not part of any kustomization. Create the real secret from a secret
# manager (External Secrets, Sealed Secrets, or kubectl create secret generic).
apiVersion: v1
kind: Secret
metadata:
  name: regintel-secrets
  namespace: regintel
type: Opaque
stringData:
  APP_DATABASE_URL: postgresql+psycopg://regintel_app:CHANGE_ME@postgres.example.internal:5432/regintel_db
  OWNER_DATABASE_URL: postgresql+psycopg://regintel:CHANGE_ME@postgres.example.internal:5432/regintel_db
  JWT_SECRET_KEY: CHANGE_ME_TO_64_RANDOM_CHARACTERS
  GEMINI_API_KEY: ""
