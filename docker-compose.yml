
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: regintel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: regintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: regintel_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U regintel -d regintel_db
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
